<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>E2E</title></head><body>
<pre id="o"></pre><iframe id="f" src="index.html" width="1440" height="810" style="border:0"></iframe>
<script>
const L=[], fail=[];
const say = s => { L.push(s); document.getElementById('o').textContent = L.join('\n'); };
window.onerror = (m,f,l) => { fail.push('исключение: '+m+' (строка '+l+')'); say('[ОШИБКА] '+m); };
const wait = ms => new Promise(r => setTimeout(r, ms));

// накопительная прозрачность по цепочке предков
const eff = (el,w) => { let n=el, op=1;
  while(n && n.nodeType===1){ const cs=w.getComputedStyle(n); op*=parseFloat(cs.opacity);
    if(cs.display==='none'||cs.visibility==='hidden') return -1; n=n.parentElement; }
  return Math.round(op*100)/100; };

const f = document.getElementById('f');

f.onload = async () => {
  await wait(6500);                       // ждём завершения загрузки
  const d = f.contentDocument, w = f.contentWindow;
  // в headless транзишены замирают на currentTime=0 — гасим анимации перед замерами
  const st = d.createElement('style');
  st.textContent = '*{transition:none!important;animation:none!important}';
  d.head.appendChild(st);

  const desk = d.getElementById('desk'), icons = d.getElementById('icons');
  const names = () => [...d.querySelectorAll('#icons .dicon > span:last-child')].map(s => s.textContent);
  const r = icons.getBoundingClientRect();
  const rightClick = (el, x, y) => el.dispatchEvent(new w.MouseEvent('contextmenu',
    { bubbles:true, clientX:x, clientY:y }));
  const ctxItem = t => [...d.getElementById('ctx').querySelectorAll('.ctx-i')]
    .find(b => b.textContent.trim().indexOf(t) === 0);

  say('=== ИМЯ СИСТЕМЫ ===');
  say('заголовок: "' + d.title + '"');
  say('в разметке нет "Windows": ' + (d.documentElement.outerHTML.indexOf('Windows') < 0));

  say('');
  say('=== ВХОД ===');
  const val = (id, v) => { const el = d.getElementById(id); if (!el) return false; el.value = v; return true; };
  const click = id => { const el = d.getElementById(id); if (el) el.click(); return !!el; };
  d.getElementById('poPower').click();
  await wait(2500);
  const E2E_NAME = 'Гость', E2E_PASS = 'e2eпароль1', E2E_CODE = 'LMN-E2E1-E2E1-E2E1';
  if (d.getElementById('fuName')) {            // первый запуск — заводим владельца
    val('fuName', E2E_NAME); val('fuPass', E2E_PASS); val('fuPass2', E2E_PASS); val('fuCode', E2E_CODE);
    click('fuBtn');
    await wait(1000);
  }
  const nameOk = val('poUserName', E2E_NAME);
  const passOk = val('poPassInput', E2E_PASS);
  say('экран входа: имя=' + nameOk + ' пароль=' + passOk);
  if (!passOk) fail.push('нет поля пароля на входе');
  click('poPassBtn');
  await wait(2600);
  const vd = eff(desk, w);
  say('#desk opacity=' + vd + ' классы="' + desk.className + '"');
  say('рабочий стол отвечает: ' + (names().length > 0));
  if (names().length === 0) fail.push('рабочий стол недоступен');
  say('значков до создания: ' + names().length);

  say('');
  say('=== ПРАВЫЙ КЛИК ПО РАБОЧЕМУ СТОЛУ ===');
  rightClick(icons, r.left + 150, r.top + 150);
  const menu = [...d.getElementById('ctx').querySelectorAll('.ctx-i')].map(b => b.textContent.trim());
  say('меню открыто: ' + d.getElementById('ctx').classList.contains('on'));
  say('пункты: ' + menu.join(' | '));
  if (!ctxItem('Создать папку')) fail.push('нет пункта «Создать папку»');

  say('');
  say('=== СОЗДАНИЕ ПАПОК ===');
  ctxItem('Создать папку').click();
  await wait(300);
  say('после 1-й: ' + names().filter(n => n.indexOf('Новая папка') === 0).join(', '));
  rightClick(icons, r.left + 150, r.top + 150);
  ctxItem('Создать папку').click();
  await wait(300);
  const folders = names().filter(n => n.indexOf('Новая папка') === 0);
  say('после 2-й: ' + folders.join(', '));
  if (folders.length !== 2) fail.push('создано папок: ' + folders.length + ' вместо 2');
  if (new Set(folders).size !== folders.length) fail.push('имена папок совпадают');

  const inVfs = w.eval('!!VFS.node("C:\\\\Users\\\\Гость\\\\Рабочий стол\\\\" + ' + JSON.stringify(folders[0] || '') + ')');
  say('папка есть в виртуальной ФС: ' + inVfs);
  if (!inVfs) fail.push('папки нет в виртуальной ФС');

  say('');
  say('=== СОЗДАНИЕ ФАЙЛОВ ===');
  rightClick(icons, r.left + 150, r.top + 150);
  ctxItem('Создать текстовый файл').click();
  await wait(300);
  rightClick(icons, r.left + 150, r.top + 150);
  ctxItem('Создать текстовый файл').click();
  await wait(300);
  const files = names().filter(n => n.indexOf('Новый текстовый документ') === 0);
  say('файлы: ' + (files.join(', ') || 'НЕТ'));
  if (files.length !== 2) fail.push('создано файлов: ' + files.length + ' вместо 2');
  if (new Set(files).size !== files.length) fail.push('имена файлов совпадают');

  say('');
  say('=== ПРОВОДНИК ===');
  const ex = w.eval('WM.open("explorer","C:\\\\Users\\\\Гость\\\\Рабочий стол")');
  await wait(400);
  const items = [...ex.body.querySelectorAll('.fitem span')].map(s => s.textContent);
  say('элементов: ' + items.length + ' → ' + items.join(', '));
  const allVisible = folders.concat(files).every(n => items.includes(n));
  say('все созданные видны: ' + allVisible);
  if (!allVisible) fail.push('созданное не видно в Проводнике');

  const firstFolder = [...ex.body.querySelectorAll('.fitem')].find(x => x.textContent.indexOf('Новая папка') === 0);
  firstFolder.dispatchEvent(new w.MouseEvent('dblclick', { bubbles:true }));
  await wait(400);
  const crumb = ex.body.querySelector('.crumbs').textContent;
  say('двойной клик → ' + crumb);
  if (crumb.indexOf('Новая папка') < 0) fail.push('двойной клик не открывает папку');

  say('');
  say('=== ТЕРМИНАЛ ===');
  const t = w.eval('WM.open("terminal")');
  t.api.run('neofetch');
  await wait(600);
  const txt = d.querySelector('.term') ? d.querySelector('.term').textContent : '';
  say('название "Люмен 1.4": ' + (txt.indexOf('Люмен 1.4') >= 0));
  say('ядро "люмен-1.4": ' + (txt.indexOf('люмен-1.4') >= 0));
  if (txt.indexOf('Люмен 1.4') < 0) fail.push('терминал не показывает название системы');

  say('');
  say('=== УДАЛЕНИЕ ПАПКИ ===');
  const fi = [...d.querySelectorAll('#icons .dicon')].find(x => x.textContent.indexOf('Новая папка') === 0);
  rightClick(fi, r.left + 40, r.top + 40);
  const del = [...d.getElementById('ctx').querySelectorAll('.ctx-i')].find(b => b.textContent.trim() === 'Удалить');
  say('в меню папки есть «Удалить»: ' + !!del);
  if (!del) fail.push('нет пункта «Удалить» у папки');
  del.click();
  await wait(300);
  const left = names().filter(n => n.indexOf('Новая папка') === 0);
  say('папок осталось: ' + left.length + ' → ' + (left.join(', ') || '—'));
  if (left.length !== 1) fail.push('удаление сработало неверно');

  say('');
  say(fail.length ? 'ИТОГ: ОШИБКИ → ' + fail.join('; ') : 'ИТОГ: всё работает, ошибок нет');
  document.title = 'DONE';
};
</script></body></html>
